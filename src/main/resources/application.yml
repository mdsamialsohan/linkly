spring:
  application:
    name: linkly
  datasource:
    url: jdbc:postgresql://localhost:5432/linkly
    username: linkly
    password: linkly
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms
      connect-timeout: 500ms

server:
  port: 8080
linkly:
  base-url: http://localhost:8080
  cache:
    ttl-hours: 24
    negative-ttl-minutes: 5

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE